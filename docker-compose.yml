services:
  db:
    image: postgres:16-alpine
    container_name: logistiek-stock-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-logistiek}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD moet gezet zijn}
      POSTGRES_DB: ${POSTGRES_DB:-logistiek}
    volumes:
      - db-data:/var/lib/postgresql/data
    # Geen poort naar buiten: alleen de app op het interne netwerk praat ermee.
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-logistiek} -d ${POSTGRES_DB:-logistiek}']
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
      # Moet bij het bouwen mee: NEXT_PUBLIC_* wordt in de browserbundle
      # ingebakken. Na het wijzigen van een van deze waarden is een herbouw
      # nodig (`docker compose up -d --build`), een herstart is niet genoeg.
      args:
        NEXT_PUBLIC_APP_MODE: ${NEXT_PUBLIC_APP_MODE:-demo}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://stock.niettegeloven.com}
    container_name: logistiek-stock
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '3003:3000'
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_APP_MODE=${NEXT_PUBLIC_APP_MODE:-demo}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-https://stock.niettegeloven.com}
      # Alleen server-side: komt nooit in de browser terecht.
      - DATABASE_URL=postgres://${POSTGRES_USER:-logistiek}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-logistiek}
      - SESSION_SECRET=${SESSION_SECRET:?SESSION_SECRET moet gezet zijn}
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://127.0.0.1:3000']
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  db-data:
