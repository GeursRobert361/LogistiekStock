# Hoort in /etc/nginx/conf.d/ -- een limit_req_zone moet in het http-blok
# staan en kan dus niet in de vhost zelf.
#
# Ruim ingesteld met opzet: de tellers staan tijdens een wedstrijd op het
# stadionnetwerk en delen daardoor een IP-adres. Een krappe limiet zou de hele
# ploeg tegelijk buitensluiten. Brute kracht op een wachtwoord van twaalf
# tekens is ook met dertig pogingen per minuut kansloos; dit is een extra
# grendel, niet de eerste verdediging.
limit_req_zone $binary_remote_addr zone=logistiek_login:10m rate=30r/m;
