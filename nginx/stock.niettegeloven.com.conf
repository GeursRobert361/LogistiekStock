# Nginx voor stock.niettegeloven.com.
#
# De snelheidsbegrenzing heeft een zone nodig die in het http-blok staat, niet
# hier. Die staat apart in nginx/logistiek-limits.conf en hoort in
# /etc/nginx/conf.d/ te liggen; zonder dat bestand weigert nginx te starten.

server {
    listen 80;
    server_name stock.niettegeloven.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name stock.niettegeloven.com;

    ssl_certificate /etc/letsencrypt/live/stock.niettegeloven.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stock.niettegeloven.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Bewust geen volledig Content-Security-Policy: Next.js zet inline scripts
    # neer en een strak beleid breekt de app. Wat hier staat dekt de gevallen
    # die er toe doen zonder iets stuk te maken.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Tellingen zijn klein; dit houdt een verdwaalde grote upload tegen.
    client_max_body_size 10m;

    # Alleen het inloggen wordt begrensd. De app praat tijdens het tellen druk
    # met /api/rpc -- een limiet daarop zou een telronde breken.
    location /api/auth {
        limit_req zone=logistiek_login burst=20 nodelay;

        proxy_pass http://localhost:3003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://localhost:3003;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
